name: Validate Sleep Survey Explorer

on:
  pull_request:
  push:
    branches:
      - feature/v2-multiclass-explainable-dashboard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app, API-test and reproducible training dependencies
        run: |
          pip install -r requirements-app.txt
          pip install "httpx>=0.27,<1" pandas==2.2.3 numpy==2.3.5 scikit-learn==1.8.0
      - name: Test binary model reproducibility and V2 predictions
        run: |
          python -m unittest discover -s tests -p "test_short_sleep.py" -v
          python -m unittest discover -s tests -p "test_duration_v2.py" -v
      - name: Validate Python compilation
        run: python -m compileall -q app.py sleep_project/behavioral_assessment.py sleep_project/duration_v2.py scripts/train_short_sleep.py scripts/train_sleep_duration_v2.py
      - name: Build non-root image
        run: docker build -t sleep-survey-explorer:test .
      - name: Exercise real container HTTP flow
        run: |
          docker run -d --name sleep-survey-smoke -p 127.0.0.1:8000:8000 sleep-survey-explorer:test
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from sleep_project.behavioral_assessment import FORM_FIELDS

          base = "http://127.0.0.1:8000"
          for attempt in range(25):
              try:
                  health = json.load(urllib.request.urlopen(base + "/healthz", timeout=3))
                  break
              except (OSError, ValueError):
                  time.sleep(1)
          else:
              raise RuntimeError("Application did not become healthy")
          assert health["status"] == "ok" and health["version"] == 2
          homepage = urllib.request.urlopen(base + "/", timeout=3).read().decode()
          assert "Sleep Survey Explorer" in homepage

          artifact = json.loads(Path("models/sleep_duration_multiclass_v2.json").read_text())
          answers = {key: artifact["category_options"][col][0] for key, col, _ in FORM_FIELDS}
          form_req = urllib.request.Request(base + "/assess", data=urllib.parse.urlencode(answers).encode())
          html = urllib.request.urlopen(form_req, timeout=3).read().decode()
          assert "Model-estimated questionnaire response" in html
          assert "What if you selected a different schedule?" in html
          compare = urllib.request.Request(
              base + "/api/compare",
              data=json.dumps({"answers": answers, "bed_time": "After 2 AM", "wake_time": "Before 6 AM"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          result = json.load(urllib.request.urlopen(compare, timeout=3))
          assert len(result["scenario"]["category_probabilities"]) == 4
          answers["bed_time"] = "not-an-option"
          invalid = urllib.request.Request(base + "/assess", data=urllib.parse.urlencode(answers).encode())
          try:
              urllib.request.urlopen(invalid, timeout=3)
              raise AssertionError("Invalid input should return 422")
          except urllib.error.HTTPError as exc:
              assert exc.code == 422
          try:
              urllib.request.urlopen(urllib.request.Request(base + "/predict", data=b""), timeout=3)
              raise AssertionError("Retired medical endpoint must return 410")
          except urllib.error.HTTPError as exc:
              assert exc.code == 410
          print("V2 HTTP and safety smoke PASS")
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs sleep-survey-smoke || true
      - name: Remove test container
        if: always()
        run: docker rm -f sleep-survey-smoke || true
